services:
  vllm:
    image: vllm/vllm-openai:v0.26.0@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b
    container_name: agent-reliability-vllm
    restart: "no"
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - mistralai/Ministral-3-8B-Instruct-2512-BF16
      - --revision
      - f6fae9795746f63c9be8344932f01275f3c63734
      - --tokenizer-revision
      - f6fae9795746f63c9be8344932f01275f3c63734
      - --served-model-name
      - ministral3-8b
      - --tokenizer-mode
      - mistral
      - --config-format
      - mistral
      - --load-format
      - mistral
      - --dtype
      - bfloat16
      - --language-model-only
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "8192"
      - --generation-config
      - vllm
      - --seed
      - "0"
      - --no-enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - mistral
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 60s
