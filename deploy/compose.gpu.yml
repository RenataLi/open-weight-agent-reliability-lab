services:
  vllm:
    image: vllm/vllm-openai:v0.26.0@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b
    container_name: agent-reliability-vllm
    restart: "no"
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen3.5-9B
      - --revision
      - cc5442c03a5c0bff0bd4c6888d9a40029c637733
      - --served-model-name
      - qwen3.5-9b
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "1"
      - --generation-config
      - vllm
      - --language-model-only
      - --no-enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 60s
