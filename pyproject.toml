[build-system]
requires = ["uv_build>=0.12.3,<0.14"]
build-backend = "uv_build"

[project]
name = "open-weight-agent-reliability-lab"
version = "0.3.0"
description = "Deterministic fault-injection and exact-outcome benchmark for open-weight tool-calling agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Renata Alieva" }]
keywords = [
  "agent-evaluation",
  "fault-injection",
  "llm",
  "mlops",
  "reliability",
  "tool-calling",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.4,<3",
  "typer>=0.27.1,<0.28",
]

[project.urls]
Documentation = "https://github.com/RenataLi/open-weight-agent-reliability-lab/tree/main/docs"
Issues = "https://github.com/RenataLi/open-weight-agent-reliability-lab/issues"
Repository = "https://github.com/RenataLi/open-weight-agent-reliability-lab"

[project.scripts]
agent-reliability-lab = "agent_reliability_lab.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff==0.16.2",
]

[tool.uv]
required-version = ">=0.12.3,<0.13"

[tool.uv.build-backend]
module-name = "agent_reliability_lab"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=agent_reliability_lab --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["agent_reliability_lab"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
]
show_missing = true

[tool.ruff]
required-version = "==0.16.2"
target-version = "py312"
line-length = 100
exclude = [".python", ".tools", ".venv", "artifacts", "models", "runs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
