<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Safety-first agent reliability architecture</title>
  <desc id="arch-desc">An open-weight model flows through a typed provider, fail-closed agent loop, policy gate, deterministic simulator, and exact oracle with immutable artifacts.</desc>
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.58" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#13143b"/>
    </linearGradient>
    <linearGradient id="arch-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arch-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15213e"/>
      <stop offset="1" stop-color="#0c142c"/>
    </linearGradient>
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-opacity="0.055"/>
    </pattern>
    <filter id="arch-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
    <filter id="arch-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arch-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1600" height="680" rx="24" fill="url(#arch-bg)"/>
  <rect width="1600" height="680" rx="24" fill="url(#arch-grid)"/>
  <ellipse cx="1350" cy="-20" rx="410" ry="230" fill="#8b5cf6" fill-opacity="0.08"/>
  <ellipse cx="180" cy="650" rx="360" ry="210" fill="#22d3ee" fill-opacity="0.07"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="54" y="78" fill="#f8fafc" font-size="38" font-weight="760" letter-spacing="-1.1">Safety-first evaluation architecture</text>
    <text x="56" y="112" fill="#94a3b8" font-size="17">Every boundary is typed, policy-aware, deterministic, and preserved as evidence.</text>
    <g transform="translate(1268 58)">
      <rect width="278" height="42" rx="21" fill="#0e2039" stroke="#22d3ee" stroke-opacity="0.36"/>
      <circle cx="22" cy="21" r="5" fill="#34d399" filter="url(#arch-glow)"/>
      <text x="38" y="27" fill="#bae6fd" font-size="13" font-weight="720" letter-spacing="1.15">FAIL CLOSED · REPLAY EXACTLY</text>
    </g>
  </g>

  <path d="M264 338H294M515 338H545M766 338H796M1017 338H1047M1268 338H1298" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arch-arrow)"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" filter="url(#arch-shadow)">
    <g transform="translate(54 196)">
      <rect width="210" height="286" rx="20" fill="url(#arch-card)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <rect x="18" y="18" width="72" height="26" rx="13" fill="#083344" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="31" y="36" fill="#a5f3fc" font-size="11" font-weight="750" letter-spacing="1.25">MODEL</text>
      <g transform="translate(74 66)" fill="none" stroke="#22d3ee" stroke-width="2">
        <path d="M0 24L28 0L59 18L28 48ZM28 0V48" opacity="0.6"/>
        <circle cx="0" cy="24" r="7" fill="#0e7490"/>
        <circle cx="28" cy="0" r="7" fill="#0891b2"/>
        <circle cx="59" cy="18" r="7" fill="#06b6d4"/>
        <circle cx="28" cy="48" r="7" fill="#22d3ee"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Open-weight model</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Pinned revision</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Local GPU inference</text>
      <path d="M18 226H192" stroke="#334155"/>
      <text x="18" y="253" fill="#67e8f9" font-size="12" font-weight="680">QWEN · MINISTRAL</text>
    </g>

    <g transform="translate(305 196)">
      <rect width="210" height="286" rx="20" fill="url(#arch-card)" stroke="#38bdf8" stroke-opacity="0.34"/>
      <rect x="18" y="18" width="88" height="26" rx="13" fill="#0c2b49" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="31" y="36" fill="#bae6fd" font-size="11" font-weight="750" letter-spacing="1.15">PROVIDER</text>
      <g transform="translate(70 68)" fill="none" stroke="#38bdf8" stroke-width="2">
        <rect x="0" y="0" width="70" height="50" rx="9"/>
        <path d="M13 15H57M13 26H45M13 37H52" stroke-linecap="round"/>
        <circle cx="59" cy="37" r="5" fill="#38bdf8" stroke="none"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Typed provider</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Schema-valid messages</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Explicit request profile</text>
      <path d="M18 226H192" stroke="#334155"/>
      <text x="18" y="253" fill="#7dd3fc" font-size="12" font-weight="680">VALIDATED I/O</text>
    </g>

    <g transform="translate(556 196)">
      <rect width="210" height="286" rx="20" fill="url(#arch-card)" stroke="#60a5fa" stroke-opacity="0.4"/>
      <rect x="18" y="18" width="82" height="26" rx="13" fill="#172554" stroke="#60a5fa" stroke-opacity="0.38"/>
      <text x="31" y="36" fill="#bfdbfe" font-size="11" font-weight="750" letter-spacing="1.2">AGENT LOOP</text>
      <g transform="translate(74 66)" fill="none" stroke="#60a5fa" stroke-width="2.3">
        <path d="M53 15A31 31 0 1 0 54 46" stroke-linecap="round"/>
        <path d="M47 4L58 14L45 20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 31H42M30 18V43" stroke-linecap="round" opacity="0.8"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Fail-closed loop</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Bounded turns + retries</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Invalid output stops safely</text>
      <path d="M18 226H192" stroke="#334155"/>
      <text x="18" y="253" fill="#93c5fd" font-size="12" font-weight="680">BUDGETS · RETRIES</text>
    </g>

    <g transform="translate(807 196)">
      <rect width="210" height="286" rx="20" fill="url(#arch-card)" stroke="#818cf8" stroke-opacity="0.42"/>
      <rect x="18" y="18" width="88" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="31" y="36" fill="#c7d2fe" font-size="11" font-weight="750" letter-spacing="1.2">POLICY GATE</text>
      <g transform="translate(75 63)" fill="none" stroke="#818cf8" stroke-width="2.2">
        <path d="M30 0L59 12V33C59 56 43 69 30 77C17 69 1 56 1 33V12Z" fill="#312e81" fill-opacity="0.45"/>
        <path d="M18 37L27 46L44 27" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Policy gate</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Exact approval binding</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Deny by default</text>
      <path d="M18 226H192" stroke="#334155"/>
      <text x="18" y="253" fill="#a5b4fc" font-size="12" font-weight="680">ALLOW · DENY · HOLD</text>
    </g>

    <g transform="translate(1058 196)">
      <rect width="210" height="286" rx="20" fill="url(#arch-card)" stroke="#8b5cf6" stroke-opacity="0.42"/>
      <rect x="18" y="18" width="96" height="26" rx="13" fill="#2e1065" stroke="#8b5cf6" stroke-opacity="0.4"/>
      <text x="31" y="36" fill="#ddd6fe" font-size="11" font-weight="750" letter-spacing="1.1">SIMULATOR</text>
      <g transform="translate(73 69)" fill="none" stroke="#a78bfa" stroke-width="2">
        <path d="M8 13H56M8 32H56M8 51H56" stroke-linecap="round" opacity="0.75"/>
        <circle cx="20" cy="13" r="8" fill="#4c1d95"/>
        <circle cx="43" cy="32" r="8" fill="#5b21b6"/>
        <circle cx="28" cy="51" r="8" fill="#7c3aed"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Deterministic sim</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Atomic state machine</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Injected typed failures</text>
      <path d="M18 226H192" stroke="#334155"/>
      <text x="18" y="253" fill="#c4b5fd" font-size="12" font-weight="680">FAULT INJECTION</text>
    </g>

    <g transform="translate(1309 196)">
      <rect width="237" height="286" rx="20" fill="url(#arch-card)" stroke="#c084fc" stroke-opacity="0.44"/>
      <rect x="18" y="18" width="92" height="26" rx="13" fill="#3b0764" stroke="#c084fc" stroke-opacity="0.4"/>
      <text x="31" y="36" fill="#f3e8ff" font-size="11" font-weight="750" letter-spacing="1.15">EVIDENCE</text>
      <g transform="translate(83 66)" fill="none" stroke="#c084fc" stroke-width="2">
        <path d="M0 0H54L70 16V68H0Z" fill="#581c87" fill-opacity="0.28"/>
        <path d="M54 0V16H70M14 29H55M14 41H55M14 53H43" stroke-linecap="round"/>
        <path d="M47 57l7 7 13-16" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="18" y="152" fill="#f8fafc" font-size="19" font-weight="740">Exact oracle + artifacts</text>
      <text x="18" y="179" fill="#94a3b8" font-size="13.5">Semantic hard-pass checks</text>
      <text x="18" y="200" fill="#94a3b8" font-size="13.5">Immutable provenance</text>
      <path d="M18 226H219" stroke="#334155"/>
      <text x="18" y="253" fill="#e9d5ff" font-size="12" font-weight="680">HASH · TRACE · REPORT</text>
    </g>
  </g>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <path d="M102 552H1498" stroke="url(#arch-accent)" stroke-width="2" stroke-opacity="0.58"/>
    <circle cx="102" cy="552" r="5" fill="#22d3ee" filter="url(#arch-glow)"/>
    <circle cx="1498" cy="552" r="5" fill="#a78bfa" filter="url(#arch-glow)"/>
    <text x="54" y="591" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">CROSS-CUTTING GUARANTEES</text>
    <g transform="translate(301 572)" font-size="13" font-weight="650">
      <g><rect width="198" height="38" rx="19" fill="#0d1c35" stroke="#22d3ee" stroke-opacity="0.28"/><text x="23" y="24" fill="#bae6fd">Typed JSON schemas</text></g>
      <g transform="translate(216)"><rect width="214" height="38" rx="19" fill="#0d1c35" stroke="#60a5fa" stroke-opacity="0.28"/><text x="23" y="24" fill="#bfdbfe">Hash-bound manifests</text></g>
      <g transform="translate(448)"><rect width="202" height="38" rx="19" fill="#0d1c35" stroke="#818cf8" stroke-opacity="0.3"/><text x="23" y="24" fill="#c7d2fe">Replayable traces</text></g>
      <g transform="translate(668)"><rect width="260" height="38" rx="19" fill="#0d1c35" stroke="#a78bfa" stroke-opacity="0.3"/><text x="23" y="24" fill="#ddd6fe">One clean commit per study</text></g>
    </g>
  </g>
</svg>
