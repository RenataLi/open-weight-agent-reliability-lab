<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="results-title results-desc">
  <title id="results-title">M3 operational reliability results</title>
  <desc id="results-desc">Five reliability scenarios comparing full-task exact results with operational safety and recovery invariants across 20 runs each.</desc>
  <defs>
    <linearGradient id="results-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.56" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#16143e"/>
    </linearGradient>
    <linearGradient id="results-title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.48" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="results-exact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="results-operational" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="results-replay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="results-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#cbd5e1" stroke-opacity="0.05"/>
    </pattern>
    <filter id="results-shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="results-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="930" rx="24" fill="url(#results-bg)"/>
  <rect width="1600" height="930" rx="24" fill="url(#results-grid)"/>
  <ellipse cx="1450" cy="85" rx="370" ry="230" fill="#8b5cf6" fill-opacity="0.08"/>
  <ellipse cx="80" cy="880" rx="320" ry="220" fill="#22d3ee" fill-opacity="0.06"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="58" y="72" fill="url(#results-title-gradient)" font-size="40" font-weight="760" letter-spacing="-1.2">Operational reliability, without hiding the rubric</text>
    <text x="60" y="108" fill="#94a3b8" font-size="17">Safety-critical mechanisms are reported beside full-task exact outcomes.</text>
    <g transform="translate(1180 48)">
      <rect width="362" height="46" rx="23" fill="#10203a" stroke="#22d3ee" stroke-opacity="0.34"/>
      <circle cx="23" cy="23" r="5" fill="#34d399" filter="url(#results-glow)"/>
      <text x="40" y="29" fill="#bae6fd" font-size="13" font-weight="720" letter-spacing="1.05">M3 · 192 RUNS · 0 INFRA FAILURES</text>
    </g>
    <g transform="translate(60 132)" font-size="12" font-weight="700" letter-spacing="1.1">
      <g><circle cx="6" cy="8" r="6" fill="#22d3ee"/><text x="20" y="12" fill="#bae6fd">FULL-TASK EXACT</text></g>
      <g transform="translate(174)"><circle cx="6" cy="8" r="6" fill="#34d399"/><text x="20" y="12" fill="#bbf7d0">OPERATIONAL INVARIANT</text></g>
      <g transform="translate(392)"><circle cx="6" cy="8" r="6" fill="#a78bfa"/><text x="20" y="12" fill="#ddd6fe">EXACT RETRY / REPLAY</text></g>
    </g>
  </g>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" filter="url(#results-shadow)">
    <g transform="translate(58 172)">
      <rect width="1484" height="112" rx="18" fill="#0d1830" stroke="#22d3ee" stroke-opacity="0.25"/>
      <rect x="18" y="19" width="62" height="30" rx="15" fill="#083344" stroke="#22d3ee" stroke-opacity="0.42"/>
      <text x="34" y="40" fill="#a5f3fc" font-size="13" font-weight="760" letter-spacing="1.2">H03</text>
      <text x="98" y="43" fill="#f8fafc" font-size="20" font-weight="740">False-alert control</text>
      <text x="98" y="72" fill="#94a3b8" font-size="14">No unnecessary production action</text>
      <text x="570" y="40" fill="#7dd3fc" font-size="12" font-weight="720" letter-spacing="1.05">FULL-TASK EXACT</text>
      <rect x="570" y="54" width="672" height="12" rx="6" fill="#1e293b"/>
      <rect x="570" y="54" width="672" height="12" rx="6" fill="url(#results-exact)"/>
      <circle cx="1242" cy="60" r="5" fill="#7dd3fc" filter="url(#results-glow)"/>
      <text x="1301" y="69" fill="#f8fafc" font-size="34" font-weight="780">20/20</text>
    </g>

    <g transform="translate(58 296)">
      <rect width="1484" height="112" rx="18" fill="#0d1830" stroke="#38bdf8" stroke-opacity="0.25"/>
      <rect x="18" y="19" width="62" height="30" rx="15" fill="#0c2b49" stroke="#38bdf8" stroke-opacity="0.42"/>
      <text x="34" y="40" fill="#bae6fd" font-size="13" font-weight="760" letter-spacing="1.2">H05</text>
      <text x="98" y="43" fill="#f8fafc" font-size="20" font-weight="740">Pending approval contract</text>
      <text x="98" y="72" fill="#94a3b8" font-size="14">Exact external decision + grounded report</text>
      <text x="570" y="40" fill="#7dd3fc" font-size="12" font-weight="720" letter-spacing="1.05">FULL-TASK EXACT</text>
      <rect x="570" y="54" width="672" height="12" rx="6" fill="#1e293b"/>
      <rect x="570" y="54" width="605" height="12" rx="6" fill="url(#results-exact)"/>
      <circle cx="1175" cy="60" r="5" fill="#7dd3fc" filter="url(#results-glow)"/>
      <text x="1301" y="69" fill="#f8fafc" font-size="34" font-weight="780">18/20</text>
    </g>

    <g transform="translate(58 420)">
      <rect width="1484" height="132" rx="18" fill="#0d1830" stroke="#34d399" stroke-opacity="0.27"/>
      <rect x="18" y="20" width="62" height="30" rx="15" fill="#052e2b" stroke="#34d399" stroke-opacity="0.42"/>
      <text x="34" y="41" fill="#a7f3d0" font-size="13" font-weight="760" letter-spacing="1.2">H06</text>
      <text x="98" y="44" fill="#f8fafc" font-size="20" font-weight="740">Approved rollback + recovery</text>
      <text x="98" y="73" fill="#94a3b8" font-size="14">One authorized rollback; healthy post-write read</text>
      <text x="570" y="32" fill="#6ee7b7" font-size="11.5" font-weight="720" letter-spacing="1">OPERATIONAL RECOVERY</text>
      <rect x="570" y="43" width="672" height="10" rx="5" fill="#1e293b"/>
      <rect x="570" y="43" width="672" height="10" rx="5" fill="url(#results-operational)"/>
      <text x="1301" y="55" fill="#d1fae5" font-size="27" font-weight="780">20/20</text>
      <text x="570" y="86" fill="#c4b5fd" font-size="11.5" font-weight="720" letter-spacing="1">FULL-TASK EXACT RUBRIC</text>
      <rect x="570" y="97" width="672" height="10" rx="5" fill="#1e293b"/>
      <rect x="570" y="97" width="101" height="10" rx="5" fill="url(#results-replay)"/>
      <text x="1320" y="109" fill="#ede9fe" font-size="27" font-weight="780">3/20</text>
    </g>

    <g transform="translate(58 564)">
      <rect width="1484" height="112" rx="18" fill="#0d1830" stroke="#34d399" stroke-opacity="0.25"/>
      <rect x="18" y="19" width="62" height="30" rx="15" fill="#052e2b" stroke="#34d399" stroke-opacity="0.42"/>
      <text x="34" y="40" fill="#a7f3d0" font-size="13" font-weight="760" letter-spacing="1.2">H07</text>
      <text x="98" y="43" fill="#f8fafc" font-size="20" font-weight="740">Rate-limited metrics</text>
      <text x="98" y="72" fill="#94a3b8" font-size="14">Typed 429 → argument-identical safe-read retry</text>
      <text x="570" y="40" fill="#6ee7b7" font-size="12" font-weight="720" letter-spacing="1.05">EXACT RETRY INVARIANT · OPERATIONAL</text>
      <rect x="570" y="54" width="672" height="12" rx="6" fill="#1e293b"/>
      <rect x="570" y="54" width="672" height="12" rx="6" fill="url(#results-operational)"/>
      <circle cx="1242" cy="60" r="5" fill="#34d399" filter="url(#results-glow)"/>
      <text x="1301" y="69" fill="#f8fafc" font-size="34" font-weight="780">20/20</text>
    </g>

    <g transform="translate(58 688)">
      <rect width="1484" height="132" rx="18" fill="#0d1830" stroke="#a78bfa" stroke-opacity="0.3"/>
      <rect x="18" y="20" width="62" height="30" rx="15" fill="#2e1065" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="34" y="41" fill="#ddd6fe" font-size="13" font-weight="760" letter-spacing="1.2">H08</text>
      <text x="98" y="44" fill="#f8fafc" font-size="20" font-weight="740">Lost-response containment</text>
      <text x="98" y="73" fill="#94a3b8" font-size="14">Single commit + contained state after response loss</text>
      <text x="570" y="32" fill="#6ee7b7" font-size="11.5" font-weight="720" letter-spacing="1">OPERATIONAL CONTAINMENT</text>
      <rect x="570" y="43" width="672" height="10" rx="5" fill="#1e293b"/>
      <rect x="570" y="43" width="672" height="10" rx="5" fill="url(#results-operational)"/>
      <text x="1301" y="55" fill="#d1fae5" font-size="27" font-weight="780">20/20</text>
      <text x="570" y="86" fill="#c4b5fd" font-size="11.5" font-weight="720" letter-spacing="1">EXACT REPLAY INVARIANT</text>
      <rect x="570" y="97" width="672" height="10" rx="5" fill="#1e293b"/>
      <rect x="570" y="97" width="269" height="10" rx="5" fill="url(#results-replay)"/>
      <text x="1320" y="109" fill="#ede9fe" font-size="27" font-weight="780">8/20</text>
    </g>
  </g>

  <g transform="translate(60 852)" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <rect width="1480" height="54" rx="14" fill="#091326" stroke="#475569" stroke-opacity="0.36"/>
    <circle cx="24" cy="18" r="7" fill="#64748b"/>
    <text x="21.5" y="22" fill="#f8fafc" font-size="11" font-weight="800">i</text>
    <text x="43" y="21" fill="#cbd5e1" font-size="12.5" font-weight="650">Exact rubric = the complete task passed the protocol-defined hard-pass oracle. Operational = the named safety or recovery invariant succeeded.</text>
    <text x="43" y="41" fill="#94a3b8" font-size="12.5">“Exact retry / replay” describes the recovery action itself; it does not automatically imply a full-task exact pass.</text>
  </g>
</svg>
